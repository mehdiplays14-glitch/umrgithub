
name: CI/CD Pipeline

# Trigger the workflow on pushes and pull requests to main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # allows manual trigger from the Actions tab

jobs:

  # ---------------------------
  # 1. Continuous Integration
  # ---------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues without failing the build
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Run tests with pytest
        run: |
          pytest --maxfail=1 --disable-warnings -q || echo "No tests found, skipping."

  # ---------------------------
  # 2. Continuous Delivery
  # ---------------------------
  package:
    name: Package Application
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create build artifact
        run: |
          mkdir -p dist
          cp calculator.py dist/
          zip -r calculator-app.zip dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app
          path: calculator-app.zip

  # ---------------------------
  # 3. Continuous Deployment
  # ---------------------------
  deploy:
    name: Deploy
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-app

      - name: Deploy step (placeholder)
        run: |
          echo "Deploying calculator-app.zip..."
          echo "Replace this step with your real deployment commands"
          echo "e.g. scp to a server, push to PyPI, deploy to a cloud service, etc."
